services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gold-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Override the localhost URIs from .env with container names
      MONGO_URI: mongodb://gold-mongo:27017/gold-dashboard
      REDIS_URL: redis://gold-redis:6379
      NODE_ENV: production
      PORT: "5000"
    networks:
      - gold-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the SPA bundle at build time.
        # Browser hits localhost:5000 — that's the backend's published port.
        VITE_API_URL: http://localhost:5000/api
    container_name: gold-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - gold-net

networks:
  gold-net:
    external: true